server {
    listen 443 ssl http2;
    server_name ~^(?<tenant>[a-z0-9-]+)\.phhotel\.vn$;

    # SSL Certificate (wildcard *.phhotel.vn)
    # ssl_certificate /etc/letsencrypt/live/phhotel.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/phhotel.vn/privkey.pem;

    # Replace this resolver/upstream strategy with your real tenant -> port map.
    # Example:
    #   tenant abc -> 127.0.0.1:19100
    #   tenant xyz -> 127.0.0.1:19101
    #
    # Nginx alone cannot derive the port from tenant automatically without a map
    # or upstream service. Use an API gateway, Lua, Caddy, Traefik, or explicit map.

    location / {
        proxy_pass http://127.0.0.1:19100;
        proxy_http_version 1.1;

        # Force a valid Origin for OpenClaw Gateway Control UI
        proxy_set_header Origin "https://openclaw.phhotel.vn";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
