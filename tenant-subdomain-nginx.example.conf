server {
    listen 443 ssl http2;
    server_name ~^(?<tenant>[a-z0-9-]+)\.phhotel\.vn$;[cite: 8]

    # SSL Certificate (Nhớ đường dẫn cert wildcard *.phhotel.vn của bạn ở đây)
    # ssl_certificate /etc/letsencrypt/live/phhotel.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/phhotel.vn/privkey.pem;

    # Replace this resolver/upstream strategy with your real tenant -> port map.[cite: 8]
    # Example:[cite: 8]
    #   tenant abc -> 127.0.0.1:19100[cite: 8]
    #   tenant xyz -> 127.0.0.1:19101[cite: 8]

    location / {
        proxy_pass http://127.0.0.1:19100;[cite: 8]
        proxy_http_version 1.1;[cite: 8]

        # ----------------------------------------------------------------------
        # 🌟 DÒNG QUAN TRỌNG NHẤT: Bắt buộc OpenClaw Gateway luôn nhận Origin hợp lệ
        # ----------------------------------------------------------------------
        proxy_set_header Origin "https://openclaw.phhotel.vn";

        # Giữ nguyên thông tin Host & IP thực tế của Client
