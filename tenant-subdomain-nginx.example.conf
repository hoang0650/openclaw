        proxy_set_header X-Forwarded-Host $host;[cite: 8]
        proxy_set_header X-Forwarded-Proto https;[cite: 8]
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;[cite: 8]

        # Hỗ trợ kết nối WebSocket cho OpenClaw Control UI
        proxy_set_header Upgrade $http_upgrade;[cite: 8]
        proxy_set_header Connection "upgrade";[cite: 8]
    }
}
