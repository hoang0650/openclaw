# Paste → Dokploy → Traefik File System → dynamic/openclaw-wildcard.yml
# (file bạn đang mở — thay toàn bộ nội dung, rồi Update)
#
# 2 service tách biệt:
#   openclaw-svc           → PHHotel  (*.phhotel.vn, openclaw.phhotel.vn)
#   openclaw-aimarkets-svc → AI Markets ({userId}.openclaw.aimarkets.vn, openclaw.aimarkets.vn)
#
# Cùng upstream container hiện tại (port 8080). Đổi URL nếu docker ps khác.
# DNS Mắt Bão: * (phhotel) + openclaw + *.openclaw (aimarkets) → 72.62.72.165

http:
  routers:
    # ----- PHHotel -----
    openclaw-tenant-https:
      rule: "HostRegexp(`^[a-f0-9]{24}\\.phhotel\\.vn$`)"
      entryPoints:
        - websecure
      service: openclaw-svc
      tls:
        certResolver: letsencrypt
      priority: 50

    openclaw-exact-https:
      rule: "Host(`69d73f54e5302e4f720b66af.phhotel.vn`)"
      entryPoints:
        - websecure
      service: openclaw-svc
      tls:
        certResolver: letsencrypt
        domains:
          - main: "69d73f54e5302e4f720b66af.phhotel.vn"
      priority: 200

    openclaw-shared-https:
      rule: "Host(`openclaw.phhotel.vn`)"
      entryPoints:
        - websecure
      service: openclaw-svc
      tls:
        certResolver: letsencrypt
        domains:
          - main: "openclaw.phhotel.vn"
      priority: 200

    # ----- AI Markets -----
    openclaw-aimarkets-tenant-https:
      rule: "HostRegexp(`^[a-f0-9]{24}\\.openclaw\\.aimarkets\\.vn$`)"
      entryPoints:
        - websecure
      service: openclaw-aimarkets-svc
      tls:
        certResolver: letsencrypt
      priority: 50

    openclaw-aimarkets-shared-https:
      rule: "Host(`openclaw.aimarkets.vn`)"
      entryPoints:
        - websecure
      service: openclaw-aimarkets-svc
      tls:
        certResolver: letsencrypt
        domains:
          - main: "openclaw.aimarkets.vn"
      priority: 200

  services:
    openclaw-svc:
      loadBalancer:
        servers:
          - url: "http://phhotel-openclaw-cexp1q:8080"
        passHostHeader: true

    openclaw-aimarkets-svc:
      loadBalancer:
        servers:
          - url: "http://phhotel-openclaw-cexp1q:8080"
        passHostHeader: true
