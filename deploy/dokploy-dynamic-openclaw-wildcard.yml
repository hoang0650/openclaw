# Paste vào Dokploy → Traefik File System → dynamic/openclaw-wildcard.yml
#
# DNS Mat Bao: A record Host=* → IP VPS (72.62.72.165)
#
# OpenClaw PHHotel chạy: node openclaw.mjs gateway --bind lan --port 8080
# → Container Port / upstream LUÔN là 8080.
#
# Sửa hostname service cho khớp Docker:
#   docker service ls   hoặc   docker ps --format "{{.Names}}"
#
# Không thêm *.phhotel.vn trong UI Domains.
# Domain cụ thể (hotelId.phhotel.vn): Domains UI, Container Port = 8080.

http:
  routers:
    openclaw-wildcard-http:
      rule: "HostRegexp(`^[a-z0-9]+\\.phhotel\\.vn$`)"
      entryPoints:
        - web
      service: openclaw-wildcard-svc
      priority: 100

    openclaw-wildcard-https:
      rule: "HostRegexp(`^[a-z0-9]+\\.phhotel\\.vn$`)"
      entryPoints:
        - websecure
      service: openclaw-wildcard-svc
      tls:
        certResolver: letsencrypt
      priority: 100

  services:
    openclaw-wildcard-svc:
      loadBalancer:
        servers:
          # Port cố định 8080 — chỉ đổi phần tên service nếu khác
          - url: "http://phhotel-openclaw-cexp1q:8080"
        passHostHeader: true
