# Paste → Dokploy → dynamic/openclaw-wildcard.yml
# TLS pattern = same as ai.aimarkets.vn (denglish): web + websecure, LE HTTP-01
# DNS: * (phhotel) + openclaw + *.openclaw (aimarkets) → 72.62.72.165

http:
  routers:
    openclaw-tenant-http:
      rule: "HostRegexp(`^[a-f0-9]{24}\\.phhotel\\.vn$`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: openclaw-svc
      priority: 50

    openclaw-tenant-https:
      rule: "HostRegexp(`^[a-f0-9]{24}\\.phhotel\\.vn$`)"
      entryPoints:
        - websecure
      service: openclaw-svc
      priority: 50
      tls:
        certResolver: letsencrypt

    openclaw-shared-http:
      rule: "Host(`openclaw.phhotel.vn`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: openclaw-svc
      priority: 200

    openclaw-shared-https:
      rule: "Host(`openclaw.phhotel.vn`)"
      entryPoints:
        - websecure
      service: openclaw-svc
      priority: 200
      tls:
        certResolver: letsencrypt
        domains:
          - main: "openclaw.phhotel.vn"

    openclaw-aimarkets-tenant-http:
      rule: "HostRegexp(`^[a-f0-9]{24}\\.openclaw\\.aimarkets\\.vn$`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: openclaw-aimarkets-svc
      priority: 50

    openclaw-aimarkets-tenant-https:
      rule: "HostRegexp(`^[a-f0-9]{24}\\.openclaw\\.aimarkets\\.vn$`)"
      entryPoints:
        - websecure
      service: openclaw-aimarkets-svc
      priority: 50
      tls:
        certResolver: letsencrypt

    openclaw-aimarkets-shared-http:
      rule: "Host(`openclaw.aimarkets.vn`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: openclaw-aimarkets-svc
      priority: 200

    openclaw-aimarkets-shared-https:
      rule: "Host(`openclaw.aimarkets.vn`)"
      entryPoints:
        - websecure
      service: openclaw-aimarkets-svc
      priority: 200
      tls:
        certResolver: letsencrypt
        domains:
          - main: "openclaw.aimarkets.vn"

  services:
    openclaw-svc:
      loadBalancer:
        servers:
          - url: "http://phhotel-openclaw-cexp1q:8080"
        passHostHeader: true

    openclaw-aimarkets-svc:
      loadBalancer:
        servers:
          - url: "http://phhotel-openclaw-cexp1q:8080"
        passHostHeader: true
