# Dokploy → Traefik File System → mở folder dynamic → tạo file mới
#   openclaw-aimarkets-wildcard.yml
# KHÔNG dán vào traefik.yml.
#
# DNS Mắt Bão: openclaw + *.openclaw  A → 72.62.72.165
# Upstream: đổi tên nếu docker ps khác (port 8080).

http:
  routers:
    openclaw-aimarkets-wildcard-https:
      rule: "HostRegexp(`^[a-f0-9]{24}\\.openclaw\\.aimarkets\\.vn$`)"
      entryPoints:
        - websecure
      service: openclaw-aimarkets-svc
      tls:
        certResolver: letsencrypt
      priority: 50

    openclaw-aimarkets-shared-https:
      rule: "Host(`openclaw.aimarkets.vn`)"
      entryPoints:
        - websecure
      service: openclaw-aimarkets-svc
      tls:
        certResolver: letsencrypt
      priority: 200

  services:
    openclaw-aimarkets-svc:
      loadBalancer:
        servers:
          - url: "http://phhotel-openclaw-cexp1q:8080"
        passHostHeader: true
