# Tuỳ chọn: file riêng nếu không muốn gộp vào openclaw-wildcard.yml
# Dokploy → dynamic/openclaw-aimarkets-wildcard.yml
#
# Khuyến nghị: dùng bản gộp trong dokploy-dynamic-openclaw-wildcard.yml
# (2 service: openclaw-svc + openclaw-aimarkets-svc trong cùng 1 file).

http:
  routers:
    openclaw-aimarkets-tenant-https:
      rule: "HostRegexp(`^[a-f0-9]{24}\\.openclaw\\.aimarkets\\.vn$`)"
      entryPoints:
        - websecure
      service: openclaw-aimarkets-svc
      tls:
        certResolver: letsencrypt
      priority: 50

    openclaw-aimarkets-shared-https:
      rule: "Host(`openclaw.aimarkets.vn`)"
      entryPoints:
        - websecure
      service: openclaw-aimarkets-svc
      tls:
        certResolver: letsencrypt
        domains:
          - main: "openclaw.aimarkets.vn"
      priority: 200

  services:
    openclaw-aimarkets-svc:
      loadBalancer:
        servers:
          - url: "http://phhotel-openclaw-cexp1q:8080"
        passHostHeader: true
